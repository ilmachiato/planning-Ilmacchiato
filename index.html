<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Planning Il Macchiato</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f0efe9;--surf:#fff;--s2:#f5f4f0;--s3:#e8e7e2;
  --t:#1a1916;--t2:#5a5850;--t3:#9a9890;
  --b:rgba(0,0,0,.08);--b2:rgba(0,0,0,.15);
  --acc:#2563EB;--acc2:#1d4ed8;--accl:#eef3fe;
  --grn:#16a34a;--grnl:#dcfce7;
  --ora:#ea580c;--oral:#fff7ed;
  --red:#dc2626;--redl:#fef2f2;
  --r:7px;--rl:11px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#111;--surf:#1c1b18;--s2:#252420;--s3:#2e2c28;
  --t:#e5e3db;--t2:#a09e96;--t3:#5a5850;
  --b:rgba(255,255,255,.07);--b2:rgba(255,255,255,.14);
  --accl:#1a2d52;--grnl:#102515;--oral:#2a1800;--redl:#250f0f;
}}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--t);min-height:100vh}
.auth-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}
.auth-box{background:var(--surf);border:1px solid var(--b2);border-radius:var(--rl);padding:2rem;width:360px;max-width:100%}
.auth-box h1{font-size:1.3rem;font-weight:700;margin:.35rem 0 .2rem}
.sub{font-size:.84rem;color:var(--t2);margin-bottom:1.3rem}
.fld{margin-bottom:.85rem}
.fld label{display:block;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--t2);margin-bottom:.28rem}
.fld input{width:100%;padding:.6rem .78rem;border:1px solid var(--b2);border-radius:var(--r);background:var(--surf);color:var(--t);font-size:.88rem;outline:none}
.fld input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(37,99,235,.13)}
.err-box{background:var(--redl);color:var(--red);border:1px solid rgba(220,38,38,.22);border-radius:var(--r);padding:.58rem .78rem;font-size:.82rem;margin-bottom:.85rem;display:none}
.af{text-align:center;margin-top:.85rem;font-size:.82rem;color:var(--t2)}
.af a{color:var(--acc);cursor:pointer;font-weight:600}
.btn{display:inline-flex;align-items:center;gap:.32rem;padding:.55rem 1rem;border-radius:var(--r);font-size:.82rem;font-weight:500;cursor:pointer;border:1px solid var(--b2);background:var(--surf);color:var(--t);transition:background .12s;white-space:nowrap}
.btn:hover{background:var(--s2)}
.btn.full{width:100%;justify-content:center}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.acc:hover{background:var(--acc2)}
.btn.grn{background:var(--grn);border-color:var(--grn);color:#fff}
.btn.grn:hover{opacity:.88}
.btn.red{color:var(--red);border-color:rgba(220,38,38,.35)}
.btn.red:hover{background:var(--redl)}
.btn.sm{padding:.34rem .7rem;font-size:.76rem}
.btn.ghost{border-color:transparent;background:transparent;color:#fff}
.btn.ghost:hover{background:var(--s2)}
.btn.sel-on{background:var(--acc);border-color:var(--acc);color:#fff}
.app{display:flex;flex-direction:column;min-height:100vh}
.topbar{background:#0a0a0a;border-bottom:1px solid #222;padding:.65rem 1.3rem;display:flex;align-items:center;gap:.7rem;position:sticky;top:0;z-index:40}
.logo{font-weight:700;font-size:.92rem}
.tbr{margin-left:auto;display:flex;align-items:center;gap:.45rem}
.nwrap{position:relative;display:inline-flex}
.ndot{position:absolute;top:-4px;right:-4px;background:#ef4444;color:#fff;border-radius:50%;width:15px;height:15px;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center}
.upill{display:flex;align-items:center;gap:.4rem;padding:.32rem .65rem;border-radius:var(--r);border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);font-size:.8rem;color:#fff}
.rbadge{font-size:.66rem;padding:2px 6px;border-radius:20px;font-weight:700}
.rbadge.admin,.rbadge.manager{background:var(--accl);color:var(--acc)}
.rbadge.employee{background:var(--s3);color:var(--t2)}
.main{flex:1;padding:1.2rem;max-width:1300px;margin:0 auto;width:100%}
.tabs{display:flex;border-bottom:1px solid var(--b);margin-bottom:1.2rem}
.tab{padding:.58rem .95rem;font-size:.84rem;font-weight:500;cursor:pointer;color:var(--t2);border-bottom:2px solid transparent;display:flex;align-items:center;gap:.32rem}
.tab.on{color:var(--acc);border-bottom-color:var(--acc)}
.cbadge{background:var(--oral);color:var(--ora);border-radius:20px;padding:1px 7px;font-size:.66rem;font-weight:700}
.ph{display:flex;align-items:center;gap:.75rem;margin-bottom:1rem;flex-wrap:wrap}
.ph h2{font-size:1rem;font-weight:700}
.wnav{display:flex;align-items:center;gap:.4rem}
.wnav button{padding:.35rem .7rem;border:1px solid var(--b2);border-radius:var(--r);background:none;color:var(--t);cursor:pointer;font-size:.8rem}
.wnav button:hover{background:var(--s2)}
.wlbl{font-size:.88rem;font-weight:600;min-width:195px;text-align:center}
.ptw{overflow-x:auto;border-radius:var(--rl);border:1px solid var(--b2)}
.pt{width:100%;border-collapse:collapse;min-width:720px}
.pt th{background:var(--s2);padding:.6rem .5rem;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--t2);border-bottom:1px solid var(--b2);white-space:nowrap;text-align:center}
.pt th.tcol{color:var(--acc)}
.pt th.emp-th{text-align:left;padding-left:.75rem}
.pt td{background:var(--surf);border-bottom:1px solid var(--b);border-right:1px solid var(--b);vertical-align:middle}
.pt tr:last-child td{border-bottom:none}
.pt td:last-child{border-right:none}
.ecell{padding:.5rem .7rem;font-size:.82rem;font-weight:600;white-space:nowrap;min-width:130px;background:var(--s2)!important}
.eav{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--accl);color:var(--acc);font-size:.72rem;font-weight:700;margin-right:.4rem;flex-shrink:0;vertical-align:middle}
.scell{padding:.3rem .35rem;min-width:105px;cursor:pointer;position:relative;user-select:none}
.scell:hover .chint{opacity:1}
.chint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.7rem;color:var(--t3);opacity:0;transition:opacity .13s;pointer-events:none}
.spill{display:flex;align-items:center;justify-content:space-between;padding:.3rem .5rem;border-radius:5px;font-size:.74rem;font-weight:600;gap:.3rem;line-height:1.3}
.spill .sdel{opacity:0;font-size:.85rem;cursor:pointer;flex-shrink:0;padding:0 2px}
.spill:hover .sdel{opacity:.6}
.scell.sel{outline:2px solid var(--acc);outline-offset:-2px;background:var(--accl)!important}
.lg{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.85rem}
.lgi{display:flex;align-items:center;gap:.3rem;font-size:.72rem;color:var(--t2)}
.lgd{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.pnl-hd{font-size:.92rem;font-weight:700;margin-bottom:.85rem;display:flex;align-items:center;gap:.45rem}
.rlist{display:flex;flex-direction:column;gap:.55rem}
.rcard{background:var(--surf);border:1px solid var(--b2);border-radius:var(--rl);padding:.85rem 1rem;display:flex;align-items:center;gap:.85rem}
.rbar{width:4px;align-self:stretch;border-radius:2px;flex-shrink:0}
.rinfo{flex:1;min-width:0}
.rinfo h4{font-size:.85rem;font-weight:600}
.rinfo p{font-size:.74rem;color:var(--t2);margin-top:2px}
.ract{display:flex;gap:.38rem;flex-shrink:0}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.42);display:flex;align-items:center;justify-content:center;z-index:100;padding:1rem;backdrop-filter:blur(2px)}
.modal{background:var(--surf);border-radius:var(--rl);padding:1.35rem;width:410px;max-width:100%;border:1px solid var(--b2);box-shadow:0 20px 60px rgba(0,0,0,.2);animation:mIn .16s ease}
@keyframes mIn{from{opacity:0;transform:translateY(-10px) scale(.97)}}
.modal h2{font-size:.92rem;font-weight:700;margin-bottom:.95rem}
.modal label{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--t2);display:block;margin-bottom:.26rem}
.modal input,.modal select,.modal textarea{width:100%;padding:.56rem .75rem;border:1px solid var(--b2);border-radius:var(--r);background:var(--surf);color:var(--t);font-size:.84rem;outline:none;margin-bottom:.78rem}
.modal input:focus,.modal select:focus,.modal textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.modal textarea{resize:vertical;min-height:52px}
.mfoot{display:flex;justify-content:flex-end;gap:.4rem;margin-top:.3rem;align-items:center}
.cgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:.35rem;margin-bottom:.78rem}
.copt{width:100%;aspect-ratio:1;border-radius:5px;cursor:pointer;border:3px solid transparent;transition:transform .1s}
.copt:hover,.copt.on{transform:scale(1.12);border-color:var(--t)}
.slist{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.78rem;max-height:250px;overflow-y:auto}
.sitem{display:flex;align-items:center;gap:.5rem;padding:.4rem .6rem;border-radius:var(--r);border:1px solid var(--b);cursor:pointer}
.sitem:hover{background:var(--s2)}
.swatch{width:20px;height:20px;border-radius:4px;flex-shrink:0}
.sname{flex:1;font-size:.82rem;font-weight:500}
.shrs{font-size:.7rem;color:var(--t2)}
.bbar{position:fixed;bottom:1.3rem;left:50%;transform:translateX(-50%);background:var(--surf);border:1px solid var(--b2);border-radius:var(--rl);padding:.6rem 1rem;display:flex;align-items:center;gap:.75rem;box-shadow:0 8px 32px rgba(0,0,0,.16);z-index:60;animation:mIn .16s ease}
.bbar select{padding:.4rem .6rem;border:1px solid var(--b2);border-radius:var(--r);background:var(--surf);color:var(--t);font-size:.82rem;outline:none}
.empty{text-align:center;padding:2.5rem 1rem;color:var(--t3)}
.empty .ico{font-size:2rem;margin-bottom:.6rem}
.toast{position:fixed;bottom:1.3rem;left:50%;transform:translateX(-50%);background:var(--t);color:var(--bg);padding:.52rem 1.15rem;border-radius:20px;font-size:.8rem;z-index:200;opacity:0;pointer-events:none;transition:opacity .22s;white-space:nowrap}
.toast.on{opacity:1}
@media(max-width:640px){.main{padding:.75rem}.scell{min-width:80px}.ecell{min-width:100px}}
</style>
</head>

    if(authMode==='register'){
      var name = G('inp-name').value.trim();
      if(!name){ showErr('Nom complet requis.'); G('auth-btn').textContent="S'inscrire"; return; }
      var r1 = await db.auth.signUp({email:email, password:pass, options:{data:{full_name:name}}});
      if(r1.error){ showErr(r1.error.message); G('auth-btn').textContent="S'inscrire"; }
      else { toast('Compte cree ! Connectez-vous.'); toggleAuth(); G('auth-btn').textContent='Se connecter'; }
    } else {
      var r2 = await db.auth.signInWithPassword({email:email, password:pass});
      if(r2.error){ showErr('Email ou mot de passe incorrect.'); G('auth-btn').textContent='Se connecter'; }
    }
  } catch(e) {
    showErr('Impossible de contacter Supabase. Verifiez SB_URL et SB_KEY.');
    G('auth-btn').textContent = authMode==='login' ? 'Se connecter' : "S'inscrire";
  }
}

async function doLogout(){ await db.auth.signOut(); }

// ---- INIT ----
async function initApp(user){
  me = user;
  G('pg-auth').style.display = 'none';
  G('pg-app').style.display  = 'flex';
  try {
    var pr = await db.from('profiles').select('*').eq('id', user.id).single();
    myProfile = pr.data || {role:'employee', full_name: user.email};
  } catch(e) {
    myProfile = {role:'employee', full_name: user.email};
  }
  G('disp-name').textContent = myProfile.full_name || user.email;
  var rb = G('disp-role');
  rb.textContent = myProfile.role || 'employee';
  rb.className = 'rbadge ' + (myProfile.role||'employee');
  if(isAdmin()){
    G('tnav-pending').style.display = '';
    G('tnav-shifts').style.display  = '';
    G('tnav-team').style.display    = '';
    G('btn-sel').style.display      = '';
  }
  await loadAll();
  if(isAdmin() && allShifts.length===0) await seedShifts();
  setupRT();
  renderPlanning();
  refreshBadge();
}

// ---- DATA ----
async function loadAll(){
  try { var e = await db.from('events').select('*').order('date');   allEvents   = e.data||[]; } catch(x){ allEvents=[]; }
  try { var p = await db.from('profiles').select('*').order('full_name'); allProfiles = p.data||[]; } catch(x){ allProfiles=[]; }
  try { var s = await db.from('shifts').select('*').order('name');  allShifts   = s.data||[]; } catch(x){ allShifts=[]; }
}

async function seedShifts(){
  var rows = DEFAULT_SHIFTS.map(function(s){ return {name:s.name,color:s.color,time_start:s.time_start,time_end:s.time_end,created_by:me.id}; });
  try { await db.from('shifts').insert(rows); } catch(x){}
  try { var r = await db.from('shifts').select('*').order('name'); allShifts = r.data||[]; } catch(x){}
}

function getPending(){ return allEvents.filter(function(e){ return e.status==='pending'; }); }

function refreshBadge(){
  if(!isAdmin()) return;
  var n = getPending().length;
  G('ndot').textContent = n;
  G('nwrap').style.display = n>0 ? '' : 'none';
  G('pend-n').textContent = n;
  G('pend-n').style.display = n>0 ? '' : 'none';
}

function setupRT(){
  db.channel('rt').on('postgres_changes',{event:'*',schema:'public',table:'events'}, async function(){
    await loadAll(); renderPlanning(); refreshBadge();
    var cur = document.querySelector('.tab.on');
    if(cur && cur.dataset.tab==='pending') renderPending();
    if(cur && cur.dataset.tab==='team')    renderTeam();
  }).on('postgres_changes',{event:'*',schema:'public',table:'shifts'}, async function(){
    await loadAll(); renderPlanning(); renderShifts();
  }).subscribe();
}

// ---- TABS ----
function goTab(name){
  ['planning','pending','shifts','team'].forEach(function(n){
    G('view-'+n).style.display = n===name ? 'block' : 'none';
  });
  document.querySelectorAll('.tab').forEach(function(t){
    t.classList.toggle('on', t.dataset.tab===name);
  });
  if(name==='pending') renderPending();
  if(name==='shifts')  renderShifts();
  if(name==='team')    renderTeam();
}

// ---- PLANNING ----
function navWeek(d){ weekStart=addDays(weekStart,d*7); clearSel(); renderPlanning(); }
function navNow(){ weekStart=mondayOf(NOW); clearSel(); renderPlanning(); }

function getWeekDays(){
  var days=[];
  for(var i=0;i<7;i++) days.push(addDays(weekStart,i));
  return days;
}

function shiftForCell(empId, dateStr){
  for(var i=0;i<allEvents.length;i++){
    var e=allEvents[i];
    if(e.employee_id===empId && e.date===dateStr && e.status!=='rejected') return e;
  }
  return null;
}

function renderPlanning(){
  var days = getWeekDays();
  var wEnd = days[6];
  G('wlbl').textContent = days[0].getDate()+' '+MONTHS[days[0].getMonth()].slice(0,3)+' - '+wEnd.getDate()+' '+MONTHS[wEnd.getMonth()].slice(0,3)+' '+wEnd.getFullYear();

  // Header
  var thead = '<tr><th class="emp-th">Employe</th>';
  for(var i=0;i<7;i++){
    var isTod = dk(days[i])===dk(NOW);
    thead += '<th class="'+(isTod?'tcol':'')+'">';
    thead += DAYS[i]+'<br><span style="font-size:1rem;font-weight:700">'+days[i].getDate()+'</span></th>';
  }
  thead += '</tr>';
  G('pt-head').innerHTML = thead;

  // Body
  var shown = isAdmin() ? allProfiles : allProfiles.filter(function(p){ return p.id===me.id; });
  if(!shown.length){
    G('pt-body').innerHTML = '<tr><td colspan="8" style="text-align:center;padding:2rem;color:var(--t3)">Aucun employe</td></tr>';
    return;
  }

  var tbody = '';
  for(var ei=0; ei<shown.length; ei++){
    var emp = shown[ei];
    var init = (emp.full_name||emp.email||'?')[0].toUpperCase();
    tbody += '<tr>';
    tbody += '<td class="ecell"><span class="eav">'+init+'</span>'+esc(emp.full_name||emp.email)+'</td>';

    for(var di=0; di<7; di++){
      var d   = days[di];
      var ds  = dk(d);
      var ev  = shiftForCell(emp.id, ds);
      var sh  = ev ? null : null;
      for(var si=0;si<allShifts.length;si++){ if(ev && allShifts[si].id===ev.shift_id){ sh=allShifts[si]; break; } }
      var isPend   = ev && ev.status==='pending';
      var cellId   = 'c-'+emp.id.replace(/-/g,'')+'_'+ds;
      var isSel    = false;
      for(var sci=0;sci<selCells.length;sci++){ if(selCells[sci].empId===emp.id && selCells[sci].date===ds){ isSel=true; break; } }

      tbody += '<td class="scell'+(isSel?' sel':'')+'" id="'+cellId+'"';
      tbody += ' onmousedown="cellMD(\''+emp.id+'\',\''+ds+'\',event)"';
      tbody += ' onmouseenter="cellME(\''+emp.id+'\',\''+ds+'\')"';
      tbody += ' onmouseup="cellMU()"';
      tbody += ' onclick="cellCK(\''+emp.id+'\',\''+ds+'\',event)">';

      if(sh){
        var bg = isPend ? 'var(--oral)' : BG[sh.color||0];
        var tx = isPend ? 'var(--ora)'  : TX[sh.color||0];
        var hrs = sh.time_start ? sh.time_start.slice(0,5)+'-'+(sh.time_end||'').slice(0,5) : '';
        var lbl = hrs ? '<br><span style="font-weight:400;font-size:.65rem;opacity:.8">'+hrs+'</span>' : '';
        var delB = isAdmin() ? '<span class="sdel" onclick="event.stopPropagation();qDel(\''+ev.id+'\')">&#x2715;</span>' : '';
        tbody += '<div class="spill" style="background:'+bg+';color:'+tx+'" onclick="event.stopPropagation();cellCK(\''+emp.id+'\',\''+ds+'\',event)">';
        tbody += '<span>'+(isPend?'&#x23F3; ':'')+esc(sh.name)+lbl+'</span>'+delB+'</div>';
      } else if(isAdmin()){
        tbody += '<span class="chint">+ Assigner</span>';
      }
      tbody += '</td>';
    }
    tbody += '</tr>';
  }
  G('pt-body').innerHTML = tbody;
  renderLegend();
}

function renderLegend(){
  var used = {};
  allEvents.forEach(function(e){ if(e.shift_id) used[e.shift_id]=true; });
  var items = allShifts.filter(function(s){ return used[s.id]; });
  var h = '';
  items.forEach(function(s){
    var hrs = s.time_start ? ' ('+s.time_start.slice(0,5)+'-'+(s.time_end||'').slice(0,5)+')' : '';
    h += '<div class="lgi"><div class="lgd" style="background:'+BG[s.color||0]+'"></div>'+esc(s.name)+hrs+'</div>';
  });
  G('legend').innerHTML = h;
}

// ---- SELECTION ----
function toggleSel(){
  selMode = !selMode;
  G('btn-sel').textContent = selMode ? 'Selection ON' : 'Selection bloc';
  G('btn-sel').className = 'btn sm'+(selMode?' sel-on':'');
  G('sel-hint').style.display = selMode ? '' : 'none';
  if(!selMode) clearSel();
}

function clearSel(){
  selCells = [];
  document.querySelectorAll('.scell.sel').forEach(function(c){ c.classList.remove('sel'); });
  G('bbar').style.display = 'none';
}

function cellMD(empId, date, e){
  if(!isAdmin() || !selMode) return;
  e.preventDefault();
  isDragging = true;
  dragStart  = {empId:empId, date:date};
  selCells   = [{empId:empId, date:date}];
  highlightSel();
}

function cellME(empId, date){
  if(!isDragging || !selMode || !dragStart || dragStart.empId!==empId) return;
  var days = getWeekDays().map(dk);
  var si = days.indexOf(dragStart.date);
  var ei = days.indexOf(date);
  var from = Math.min(si,ei), to = Math.max(si,ei);
  selCells = [];
  for(var i=from;i<=to;i++) selCells.push({empId:empId, date:days[i]});
  highlightSel();
}

function cellMU(){
  if(!isDragging) return;
  isDragging = false;
  if(selCells.length>0) showBbar();
}

function highlightSel(){
  document.querySelectorAll('.scell').forEach(function(el){ el.classList.remove('sel'); });
  selCells.forEach(function(c){
    var el = G('c-'+c.empId.replace(/-/g,'')+'_'+c.date);
    if(el) el.classList.add('sel');
  });
}

function showBbar(){
  if(!selCells.length) return;
  fillShiftSelect('bbar-shift');
  G('bbar-info').textContent = selCells.length+' jour(s) selectionne(s)';
  G('bbar').style.display = 'flex';
}

async function applyBulk(){
  var shiftId = G('bbar-shift').value;
  if(!shiftId){ toast('Choisis un creneau.'); return; }
  for(var i=0;i<selCells.length;i++){
    var c = selCells[i];
    var existing = shiftForCell(c.empId, c.date);
    try {
      if(existing){
        await db.from('events').update({shift_id:shiftId, status:'approved', updated_by:me.id}).eq('id',existing.id);
      } else {
        await db.from('events').insert({employee_id:c.empId, date:c.date, shift_id:shiftId, status:'approved', created_by:me.id});
      }
    } catch(x){}
  }
  toast(selCells.length+' creneau(x) assigne(s)');
  clearSel();
  await loadAll(); renderPlanning(); refreshBadge();
}

function cellCK(empId, date, e){
  if(selMode && selCells.length>0) return;
  if(!isAdmin() && empId!==me.id) return;
  openCellModal(empId, date);
}

// ---- CELL MODAL ----
function fillShiftSelect(id){
  var el = G(id);
  var first = el.options[0];
  el.innerHTML = '';
  el.appendChild(first || (function(){ var o=document.createElement('option'); o.value=''; o.textContent='-- Aucun --'; return o; })());
  allShifts.forEach(function(s){
    var o = document.createElement('option');
    o.value = s.id;
    o.textContent = s.name + (s.time_start ? ' ('+s.time_start.slice(0,5)+'-'+(s.time_end||'').slice(0,5)+')' : '');
    el.appendChild(o);
  });
}

function openCellModal(empId, date){
  cellCtx = {empId:empId, date:date};
  var emp = null;
  for(var i=0;i<allProfiles.length;i++){ if(allProfiles[i].id===empId){ emp=allProfiles[i]; break; } }
  var ev  = shiftForCell(empId, date);
  var d   = new Date(date+'T12:00');
  G('cm-title').textContent = isAdmin() ? 'Assigner un creneau' : 'Demande de creneau';
  G('cm-info').textContent  = (emp ? emp.full_name||emp.email : '-')+' - '+DAYS[d.getDay()===0?6:d.getDay()-1]+' '+d.getDate()+' '+MONTHS[d.getMonth()];
  fillShiftSelect('cm-shift');
  G('cm-shift').value = ev ? (ev.shift_id||'') : '';
  G('cm-note').value  = ev ? (ev.note||'') : '';
  G('cm-del').style.display = ev ? '' : 'none';
  G('cm-status-wrap').style.display = isAdmin() ? 'none' : 'block';
  G('ov-cell').style.display = 'flex';
}
function closeCellModal(){ G('ov-cell').style.display='none'; cellCtx=null; }

async function saveCellModal(){
  if(!cellCtx) return;
  var shiftId = G('cm-shift').value;
  var note    = G('cm-note').value.trim() || null;
  var status  = isAdmin() ? 'approved' : (G('cm-status').value||'pending');
  var empId   = cellCtx.empId, date = cellCtx.date;
  var existing = shiftForCell(empId, date);
  try {
    if(!shiftId){
      if(existing) await db.from('events').delete().eq('id',existing.id);
    } else if(existing){
      await db.from('events').update({shift_id:shiftId, note:note, status:status, updated_by:me.id}).eq('id',existing.id);
    } else {
      await db.from('events').insert({employee_id:empId, date:date, shift_id:shiftId, note:note, status:status, created_by:me.id});
    }
  } catch(x){ toast('Erreur: '+x.message); return; }
  toast(isAdmin() ? 'Creneau enregistre' : 'Demande envoyee');
  closeCellModal();
  await loadAll(); renderPlanning(); refreshBadge();
}

async function clearCell(){
  if(!cellCtx) return;
  var existing = shiftForCell(cellCtx.empId, cellCtx.date);
  if(existing){ try{ await db.from('events').delete().eq('id',existing.id); }catch(x){} toast('Efface'); }
  closeCellModal();
  await loadAll(); renderPlanning();
}

async function qDel(evId){
  if(!confirm('Effacer ce creneau ?')) return;
  try { await db.from('events').delete().eq('id',evId); } catch(x){}
  toast('Efface');
  await loadAll(); renderPlanning();
}

// ---- PENDING ----
function renderPending(){
  var list = getPending();
  var el = G('pend-list');
  if(!list.length){ el.innerHTML='<div class="empty"><div class="ico">&#10003;</div>Aucune demande</div>'; return; }
  var h = '';
  list.forEach(function(ev){
    var emp = null, sh = null;
    for(var i=0;i<allProfiles.length;i++){ if(allProfiles[i].id===ev.employee_id){ emp=allProfiles[i]; break; } }
    for(var i=0;i<allShifts.length;i++){  if(allShifts[i].id===ev.shift_id){      sh=allShifts[i];   break; } }
    var who  = emp ? (emp.full_name||emp.email) : '-';
    var what = sh  ? sh.name : '-';
    var dd   = new Date((ev.date||'')+'T12:00');
    var ds   = isNaN(dd) ? '-' : DAYS[dd.getDay()===0?6:dd.getDay()-1]+' '+dd.getDate()+' '+MONTHS[dd.getMonth()];
    var col  = sh ? (sh.color||0) : 0;
    h += '<div class="rcard">';
    h += '<div class="rbar" style="background:'+BG[col]+'"></div>';
    h += '<div class="rinfo"><h4>'+esc(what)+' - '+esc(who)+'</h4><p>'+ds+(ev.note?' - '+esc(ev.note.slice(0,60)):'')+'</p></div>';
    h += '<div class="ract"><button class="btn grn sm" onclick="approve(\''+ev.id+'\')">Approuver</button><button class="btn red sm" onclick="reject(\''+ev.id+'\')">Rejeter</button></div>';
    h += '</div>';
  });
  el.innerHTML = h;
}

async function approve(id){
  try{ await db.from('events').update({status:'approved'}).eq('id',id); }catch(x){}
  toast('Approuve'); await loadAll(); renderPlanning(); renderPending(); refreshBadge();
}
async function reject(id){
  if(!confirm('Rejeter ?')) return;
  try{ await db.from('events').update({status:'rejected'}).eq('id',id); }catch(x){}
  toast('Rejete'); await loadAll(); renderPlanning(); renderPending(); refreshBadge();
}

// ---- SHIFTS ----
function renderShifts(){
  var el = G('shift-list');
  if(!allShifts.length){ el.innerHTML='<div class="empty"><div class="ico">&#9881;</div>Aucun creneau</div>'; return; }
  var h = '';
  allShifts.forEach(function(s){
    var hrs = s.time_start ? s.time_start.slice(0,5)+' - '+(s.time_end||'').slice(0,5) : '';
    h += '<div class="sitem" onclick="openShiftModal(\''+s.id+'\')">';
    h += '<div class="swatch" style="background:'+BG[s.color||0]+'"></div>';
    h += '<span class="sname">'+esc(s.name)+'</span>';
    h += '<span class="shrs">'+hrs+'</span>';
    h += '</div>';
  });
  el.innerHTML = h;
}

function openShiftModal(id){
  editShiftId = id || null;
  var s = null;
  if(id){ for(var i=0;i<allShifts.length;i++){ if(allShifts[i].id===id){ s=allShifts[i]; break; } } }
  G('sm-title').textContent = s ? 'Modifier le creneau' : 'Nouveau creneau';
  G('sm-name').value  = s ? (s.name||'') : '';
  G('sm-start').value = s ? (s.time_start||'') : '';
  G('sm-end').value   = s ? (s.time_end||'') : '';
  smColor = s ? (s.color||0) : 0;
  G('sm-del').style.display = s ? '' : 'none';
  buildColorGrid();
  G('ov-shift').style.display = 'flex';
  setTimeout(function(){ G('sm-name').focus(); }, 50);
}
function closeShiftModal(){ G('ov-shift').style.display='none'; editShiftId=null; }

function buildColorGrid(){
  var h = '';
  for(var i=0;i<BG.length;i++){
    h += '<div class="copt'+(i===smColor?' on':'')+'" style="background:'+BG[i]+'" onclick="smColor='+i+';buildColorGrid()"></div>';
  }
  G('sm-colors').innerHTML = h;
}

async function saveShift(){
  var name = G('sm-name').value.trim();
  if(!name){ G('sm-name').style.boxShadow='0 0 0 2px var(--red)'; return; }
  G('sm-name').style.boxShadow = '';
  var payload = {name:name, color:smColor, time_start:G('sm-start').value||null, time_end:G('sm-end').value||null, created_by:me.id};
  try {
    if(editShiftId){ await db.from('shifts').update(payload).eq('id',editShiftId); toast('Creneau modifie'); }
    else            { await db.from('shifts').insert(payload); toast('Creneau cree'); }
  } catch(x){ toast('Erreur: '+x.message); return; }
  closeShiftModal(); await loadAll(); renderShifts(); renderPlanning();
}

async function deleteShift(){
  if(!editShiftId || !confirm('Supprimer ce creneau ? Les assignations liees seront perdues.')) return;
  try {
    await db.from('events').delete().eq('shift_id', editShiftId);
    await db.from('shifts').delete().eq('id', editShiftId);
    toast('Supprime');
  } catch(x){ toast('Erreur: '+x.message); return; }
  closeShiftModal(); await loadAll(); renderShifts(); renderPlanning();
}

// ---- TEAM ----
function renderTeam(){
  if(!allProfiles.length){ G('team-body').innerHTML='<div class="empty"><div class="ico">&#128101;</div>Aucun membre</div>'; return; }
  var h = '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.65rem">';
  allProfiles.forEach(function(p){
    var approved = allEvents.filter(function(e){ return e.employee_id===p.id && e.status==='approved'; }).length;
    var pend     = allEvents.filter(function(e){ return e.employee_id===p.id && e.status==='pending';  }).length;
    var init     = (p.full_name||p.email||'?')[0].toUpperCase();
    h += '<div style="background:var(--surf);border:1px solid var(--b2);border-radius:var(--rl);padding:.85rem">';
    h += '<div style="display:flex;align-items:center;gap:.55rem;margin-bottom:.5rem">';
    h += '<div style="width:32px;height:32px;border-radius:50%;background:var(--accl);color:var(--acc);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.82rem;flex-shrink:0">'+init+'</div>';
    h += '<div><div style="font-size:.82rem;font-weight:600">'+esc(p.full_name||p.email)+'</div><span class="rbadge '+p.role+'">'+p.role+'</span></div></div>';
    h += '<div style="font-size:.74rem;color:var(--t2)">'+approved+' shift(s)';
    if(pend) h += ' - <span style="color:var(--ora)">'+pend+' en attente</span>';
    h += '</div></div>';
  });
  G('team-body').innerHTML = h + '</div>';
}

// ---- GLOBAL EVENTS ----
document.addEventListener('mouseup', function(){
  if(isDragging){ isDragging=false; if(selCells.length>0) showBbar(); }
});
document.addEventListener('keydown', function(e){
  if(e.key==='Escape'){ closeCellModal(); closeShiftModal(); clearSel(); }
});

// ---- BOOT ----
db.auth.onAuthStateChange(function(evt, session){
  if(session && session.user){
    initApp(session.user);
  } else {
    G('pg-auth').style.display = 'flex';
    G('pg-app').style.display  = 'none';
    me=null; myProfile=null;
  }
});
</script>
