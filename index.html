<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Planning Il Macchiato</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f4f0;--surf:#fff;--s2:#f0efe9;--s3:#e5e4de;
  --t:#1a1916;--t2:#5a5850;--t3:#9a9890;
  --b:rgba(0,0,0,.08);--b2:rgba(0,0,0,.15);
  --acc:#2563EB;--acc2:#1d4ed8;--accl:#eef3fe;
  --grn:#16a34a;--grnl:#dcfce7;
  --ora:#ea580c;--oral:#fff7ed;
  --red:#dc2626;--redl:#fef2f2;
  --r:8px;--rl:12px;
}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--t);min-height:100vh}
.auth-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem;background:#0a0a0a}
.auth-box{background:#fff;border-radius:var(--rl);padding:2rem;width:360px;max-width:100%;text-align:center}
.auth-box img{height:80px;width:auto;margin-bottom:1rem}
.auth-box h1{font-size:1.15rem;font-weight:700;margin-bottom:.2rem;color:#111}
.auth-sub{font-size:.84rem;color:#666;margin-bottom:1.3rem}
.fld{margin-bottom:.85rem;text-align:left}
.fld label{display:block;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#555;margin-bottom:.28rem}
.fld input{width:100%;padding:.6rem .78rem;border:1px solid #ddd;border-radius:var(--r);background:#fff;color:#111;font-size:.88rem;outline:none}
.fld input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(37,99,235,.13)}
.err-box{background:var(--redl);color:var(--red);border:1px solid rgba(220,38,38,.22);border-radius:var(--r);padding:.58rem .78rem;font-size:.82rem;margin-bottom:.85rem;display:none;text-align:left}
.af{text-align:center;margin-top:.85rem;font-size:.82rem;color:#666}
.af a{color:var(--acc);cursor:pointer;font-weight:600}
.btn{display:inline-flex;align-items:center;gap:.32rem;padding:.55rem 1rem;border-radius:var(--r);font-size:.82rem;font-weight:500;cursor:pointer;border:1px solid var(--b2);background:var(--surf);color:var(--t);transition:background .12s;white-space:nowrap}
.btn:hover{background:var(--s2)}
.btn.full{width:100%;justify-content:center}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.acc:hover{background:var(--acc2)}
.btn.grn{background:var(--grn);border-color:var(--grn);color:#fff}
.btn.grn:hover{opacity:.88}
.btn.red{color:var(--red);border-color:rgba(220,38,38,.35)}
.btn.red:hover{background:var(--redl)}
.btn.sm{padding:.34rem .7rem;font-size:.76rem}
.btn.ghost{border-color:transparent;background:transparent;color:#fff}
.btn.ghost:hover{background:rgba(255,255,255,.12)}
.app{display:flex;flex-direction:column;min-height:100vh}
.topbar{background:#0a0a0a;padding:.5rem 1.5rem;display:flex;align-items:center;min-height:54px;position:sticky;top:0;z-index:40}
.topbar-logo{flex:1;display:flex;justify-content:center}
.topbar-logo img{height:38px;width:auto;object-fit:contain}
.tbr{position:absolute;right:1.5rem;display:flex;align-items:center;gap:.45rem}
.upill{display:flex;align-items:center;gap:.4rem;padding:.32rem .65rem;border-radius:var(--r);border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);font-size:.8rem;color:#fff}
.rbadge{font-size:.66rem;padding:2px 6px;border-radius:20px;font-weight:700}
.rbadge.admin,.rbadge.manager{background:var(--accl);color:var(--acc)}
.rbadge.employee{background:rgba(255,255,255,.15);color:#ccc}
.nwrap{position:relative;display:inline-flex}
.ndot{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;border-radius:50%;width:15px;height:15px;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center}
.main{flex:1;padding:1.2rem;max-width:1200px;margin:0 auto;width:100%}
.tabs{display:flex;border-bottom:1px solid var(--b);margin-bottom:1.2rem}
.tab{padding:.58rem .95rem;font-size:.84rem;font-weight:500;cursor:pointer;color:var(--t2);border-bottom:2px solid transparent;display:flex;align-items:center;gap:.32rem}
.tab.on{color:var(--acc);border-bottom-color:var(--acc)}
.cbadge{background:var(--oral);color:var(--ora);border-radius:20px;padding:1px 7px;font-size:.66rem;font-weight:700}
.cal-top{display:flex;align-items:center;gap:.6rem;margin-bottom:1rem;flex-wrap:wrap}
.cal-top h2{font-size:1.1rem;font-weight:700;min-width:170px}
.cnav{display:flex;align-items:center;gap:.4rem}
.cnav button{padding:.38rem .75rem;border:1px solid var(--b2);border-radius:var(--r);background:none;color:var(--t);cursor:pointer;font-size:.82rem}
.cnav button:hover{background:var(--s2)}
.cal-hint{font-size:.78rem;color:var(--t3);margin-left:.3rem}
.mgrid{display:grid;grid-template-columns:32px repeat(7,1fr);gap:1px;background:var(--b2);border:1px solid var(--b2);border-radius:var(--rl);overflow:hidden;margin-bottom:1rem}
.dh{background:var(--s2);text-align:center;padding:.5rem 0;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--t2)}
.wkc{background:var(--s2);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .12s}
.wkc:hover{background:var(--accl)}
.wkc.on{background:var(--acc)}
.wkc .wn{font-size:.6rem;font-weight:700;color:var(--acc);writing-mode:vertical-rl}
.wkc.on .wn{color:#fff}
.dc{background:var(--surf);min-height:88px;padding:.38rem .3rem;cursor:pointer;transition:background .12s}
.dc:hover{background:var(--s2)}
.dc.other .dn{color:var(--t3)}
.dc.today .dn{background:var(--acc);color:#fff;border-radius:50%}
.dc.hi{background:var(--accl)}
.dn{width:23px;height:23px;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:600;margin-bottom:.22rem}
.chip{font-size:.64rem;padding:2px 4px;border-radius:3px;margin-bottom:2px;border-left:2px solid transparent;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:2px;line-height:1.3}
.chip:hover{opacity:.8}
.chip .cx{opacity:0;font-size:.75rem;flex-shrink:0}
.chip:hover .cx{opacity:.6}
.wasgn{background:var(--surf);border:2px solid var(--acc);border-radius:var(--rl);padding:1.2rem;margin-bottom:1rem}
.wasgn-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:.9rem}
.wasgn-hd h3{font-size:.92rem;font-weight:700;color:var(--acc)}
.wg{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin-bottom:.8rem}
.wg label{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--t2);display:block;margin-bottom:.26rem}
.wg select{width:100%;padding:.55rem .72rem;border:1px solid var(--b2);border-radius:var(--r);background:var(--surf);color:var(--t);font-size:.82rem;outline:none}
.wg select:focus{border-color:var(--acc)}
.days-row{display:flex;gap:.35rem;flex-wrap:wrap;margin-bottom:.8rem}
.db{padding:.3rem .62rem;border-radius:var(--r);border:1px solid var(--b2);cursor:pointer;font-size:.76rem;font-weight:500;background:none;color:var(--t2);transition:all .12s;user-select:none}
.db.on{background:var(--acc);border-color:var(--acc);color:#fff}
.wfoot{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.pnl-hd{font-size:.92rem;font-weight:700;margin-bottom:.85rem}
.rlist{display:flex;flex-direction:column;gap:.55rem}
.rcard{background:var(--surf);border:1px solid var(--b2);border-radius:var(--rl);padding:.85rem 1rem;display:flex;align-items:center;gap:.85rem}
.rbar{width:4px;align-self:stretch;border-radius:2px;flex-shrink:0}
.rinfo{flex:1;min-width:0}
.rinfo h4{font-size:.85rem;font-weight:600}
.rinfo p{font-size:.74rem;color:var(--t2);margin-top:2px}
.ract{display:flex;gap:.38rem;flex-shrink:0}
.slist{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.78rem;max-height:260px;overflow-y:auto}
.sitem{display:flex;align-items:center;gap:.5rem;padding:.42rem .65rem;border-radius:var(--r);border:1px solid var(--b);cursor:pointer}
.sitem:hover{background:var(--s2)}
.sw{width:20px;height:20px;border-radius:4px;flex-shrink:0}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:1rem;backdrop-filter:blur(2px)}
.modal{background:var(--surf);border-radius:var(--rl);padding:1.4rem;width:400px;max-width:100%;border:1px solid var(--b2);box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal h2{font-size:.95rem;font-weight:700;margin-bottom:1rem}
.modal label{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--t2);display:block;margin-bottom:.26rem}
.modal input,.modal select{width:100%;padding:.56rem .72rem;border:1px solid var(--b2);border-radius:var(--r);background:var(--surf);color:var(--t);font-size:.82rem;outline:none;margin-bottom:.78rem}
.mfoot{display:flex;justify-content:flex-end;gap:.4rem;margin-top:.3rem;align-items:center}
.cgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:.35rem;margin-bottom:.78rem}
.copt{width:100%;aspect-ratio:1;border-radius:5px;cursor:pointer;border:3px solid transparent;transition:transform .1s}
.copt:hover,.copt.on{border-color:var(--t);transform:scale(1.1)}
.empty{text-align:center;padding:2.5rem 1rem;color:var(--t3)}
.toast{position:fixed;bottom:1.3rem;left:50%;transform:translateX(-50%);background:#1a1916;color:#fff;padding:.52rem 1.15rem;border-radius:20px;font-size:.8rem;z-index:200;opacity:0;pointer-events:none;transition:opacity .22s;white-space:nowrap}
.toast.on{opacity:1}
.legend{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.75rem}
.lgi{display:flex;align-items:center;gap:.32rem;font-size:.72rem;color:var(--t2)}
.lgd{width:10px;height:10px;border-radius:2px}
</style>
</head>
<body>

<div id="pg-auth" class="auth-page">
  <div class="auth-box">
    <img id="lg1" src="" alt="Il Macchiato"/>
    <h1>Planning Il Macchiato</h1>
    <p class="auth-sub" id="auth-sub">Connectez-vous</p>
    <div class="err-box" id="auth-err"></div>
    <div id="reg-flds" style="display:none">
      <div class="fld"><label>Nom complet</label><input id="inp-name" placeholder="Jean Dupont" autocomplete="name"/></div>
    </div>
    <div class="fld"><label>Email</label><input id="inp-email" type="email" placeholder="vous@ilmacchiato.fr" autocomplete="email"/></div>
    <div class="fld"><label>Mot de passe</label><input id="inp-pass" type="password" placeholder="password"/></div>
    <button class="btn acc full" id="auth-btn" onclick="doAuth()">Se connecter</button>
    <div class="af"><span id="tog-txt">Pas encore de compte ?</span> <a onclick="toggleAuth()">S'inscrire</a></div>
  </div>
</div>

<div id="pg-app" class="app" style="display:none">
  <div class="topbar">
    <div class="topbar-logo"><img id="lg2" src="" alt="Il Macchiato"/></div>
    <div class="tbr">
      <div class="nwrap" id="nwrap" style="display:none">
        <button class="btn sm ghost" onclick="goTab('pending')">Demandes</button>
        <span class="ndot" id="ndot">0</span>
      </div>
      <div class="upill"><span id="disp-name">-</span><span class="rbadge" id="disp-role">-</span></div>
      <button class="btn sm ghost" onclick="doLogout()">Deconnexion</button>
    </div>
  </div>

  <div class="main">
    <div class="tabs">
      <div class="tab on" data-tab="planning" onclick="goTab('planning')">Calendrier</div>
      <div class="tab" data-tab="pending" id="tnav-pending" style="display:none" onclick="goTab('pending')">Demandes <span class="cbadge" id="pend-n" style="display:none">0</span></div>
      <div class="tab" data-tab="shifts" id="tnav-shifts" style="display:none" onclick="goTab('shifts')">Creneaux</div>
      <div class="tab" data-tab="team" id="tnav-team" style="display:none" onclick="goTab('team')">Equipe</div>
    </div>

    <div id="view-planning">
      <div class="cal-top">
        <div class="cnav">
          <button onclick="navMonth(-1)">&#8592;</button>
          <h2 id="cal-label">-</h2>
          <button onclick="navMonth(1)">&#8594;</button>
          <button onclick="navToday()" style="font-size:.74rem">Aujourd'hui</button>
        </div>
        <span class="cal-hint" id="cal-hint"></span>
      </div>

      <div class="wasgn" id="wasgn" style="display:none">
        <div class="wasgn-hd">
          <h3 id="wa-title">Assigner la semaine</h3>
          <button class="btn sm" onclick="closeWasgn()">Fermer</button>
        </div>
        <div class="wg">
          <div><label>Employe</label><select id="wa-emp"><option value="">-- Choisir --</option></select></div>
          <div><label>Creneau</label><select id="wa-shift"><option value="">-- Choisir --</option></select></div>
        </div>
        <div style="margin-bottom:.8rem">
          <label style="font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--t2);display:block;margin-bottom:.38rem">Jours</label>
          <div class="days-row" id="days-row"></div>
        </div>
        <div class="wfoot">
          <button class="btn acc sm" onclick="applyWeek()">Appliquer</button>
          <button class="btn sm" onclick="closeWasgn()">Annuler</button>
          <span id="wa-msg" style="font-size:.78rem;color:var(--t2)"></span>
        </div>
      </div>

      <div class="mgrid" id="mgrid"></div>
      <div class="legend" id="legend"></div>
    </div>

    <div id="view-pending" style="display:none">
      <div class="pnl-hd">Demandes en attente</div>
      <div class="rlist" id="pend-list"></div>
    </div>

    <div id="view-shifts" style="display:none">
      <div class="pnl-hd">Gerer les creneaux</div>
      <div class="slist" id="shift-list"></div>
      <button class="btn acc sm" onclick="openShiftModal(null)">+ Nouveau creneau</button>
    </div>

    <div id="view-team" style="display:none">
      <div class="pnl-hd">Membres de l'equipe</div>
      <div id="team-body"></div>
    </div>
  </div>
</div>

<div class="ov" id="ov-shift" style="display:none" onclick="if(event.target===this)closeShiftModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <h2 id="sm-title">Nouveau creneau</h2>
    <label>Nom *</label>
    <input id="sm-name" placeholder="Ex: Il Macchiato 1 Matin"/>
    <div style="display:flex;gap:.6rem">
      <div style="flex:1"><label>Debut</label><input id="sm-start" type="time" style="margin-bottom:.78rem"/></div>
      <div style="flex:1"><label>Fin</label><input id="sm-end" type="time" style="margin-bottom:.78rem"/></div>
    </div>
    <label>Couleur</label>
    <div class="cgrid" id="sm-colors"></div>
    <div class="mfoot">
      <button class="btn red sm" id="sm-del" style="display:none;margin-right:auto" onclick="deleteShift()">Supprimer</button>
      <button class="btn sm" onclick="closeShiftModal()">Annuler</button>
      <button class="btn acc sm" onclick="saveShift()">Enregistrer</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

function G(id){ return document.getElementById(id); }
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function dk(d){ return d.toISOString().slice(0,10); }
function isAdmin(){ return myProfile&&(myProfile.role==='admin'||myProfile.role==='manager'); }
function addD(d,n){ var x=new Date(d); x.setDate(x.getDate()+n); return x; }
function monOf(d){ var x=new Date(d); var day=x.getDay(); x.setDate(x.getDate()-(day===0?6:day-1)); x.setHours(0,0,0,0); return x; }

function toast(msg){
  var t=G('toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(t._t); t._t=setTimeout(function(){ t.classList.remove('on'); },2600);
}

function toggleAuth(){
  authMode=authMode==='login'?'register':'login';
  G('auth-btn').textContent=authMode==='login'?'Se connecter':"S'inscrire";
  G('auth-sub').textContent=authMode==='login'?'Connectez-vous':'Creez votre compte';
  G('reg-flds').style.display=authMode==='register'?'block':'none';
  G('tog-txt').textContent=authMode==='login'?'Pas encore de compte ?':'Deja un compte ?';
  document.querySelector('.af a').textContent=authMode==='login'?"S'inscrire":'Se connecter';
  G('auth-err').style.display='none';
}
function showErr(m){ G('auth-err').textContent=m; G('auth-err').style.display='block'; }

async function doAuth(){
  var email=G('inp-email').value.trim(), pass=G('inp-pass').value;
  G('auth-err').style.display='none';
  if(!email||!pass){ showErr('Email et mot de passe requis.'); return; }
  G('auth-btn').textContent='...';
  try {
    if(authMode==='register'){
      var name=G('inp-name').value.trim();
      if(!name){ showErr('Nom complet requis.'); G('auth-btn').textContent="S'inscrire"; return; }
      var r1=await db.auth.signUp({email:email,password:pass,options:{data:{full_name:name}}});
      if(r1.error){ showErr(r1.error.message); G('auth-btn').textContent="S'inscrire"; }
      else{ toast('Compte cree ! Connectez-vous.'); toggleAuth(); G('auth-btn').textContent='Se connecter'; }
    } else {
      var r2=await db.auth.signInWithPassword({email:email,password:pass});
      if(r2.error){ showErr('Email ou mot de passe incorrect.'); G('auth-btn').textContent='Se connecter'; }
    }
  } catch(e){ showErr('Erreur serveur. Verifiez SB_URL et SB_KEY.'); G('auth-btn').textContent='Se connecter'; }
}
async function doLogout(){ await db.auth.signOut(); }

async function initApp(user){
  me=user;
  G('pg-auth').style.display='none';
  G('pg-app').style.display='flex';
  try{ var pr=await db.from('profiles').select('*').eq('id',user.id).single(); myProfile=pr.data||{role:'employee',full_name:user.email}; }
  catch(e){ myProfile={role:'employee',full_name:user.email}; }
  G('disp-name').textContent=myProfile.full_name||user.email;
  var rb=G('disp-role'); rb.textContent=myProfile.role||'employee'; rb.className='rbadge '+(myProfile.role||'employee');
  if(isAdmin()){
    G('tnav-pending').style.display='';
    G('tnav-shifts').style.display='';
    G('tnav-team').style.display='';
    G('cal-hint').textContent='Cliquez sur le numero de semaine pour assigner';
  }
  await loadAll();
  if(isAdmin()&&allShifts.length===0) await seedShifts();
  setupRT();
  renderCal();
  refreshBadge();
}

async function loadAll(){
  try{ var e=await db.from('events').select('*').order('date'); allEvents=e.data||[]; }catch(x){ allEvents=[]; }
  try{ var p=await db.from('profiles').select('*').order('full_name'); allProfiles=p.data||[]; }catch(x){ allProfiles=[]; }
  try{ var s=await db.from('shifts').select('*').order('name'); allShifts=s.data||[]; }catch(x){ allShifts=[]; }
}

async function seedShifts(){
  var rows=DS.map(function(s){ return {name:s.name,color:s.color,time_start:s.ts,time_end:s.te,created_by:me.id}; });
  try{ await db.from('shifts').insert(rows); var r=await db.from('shifts').select('*').order('name'); allShifts=r.data||[]; }catch(x){}
}

function getPending(){ return allEvents.filter(function(e){ return e.status==='pending'; }); }

function refreshBadge(){
  if(!isAdmin()) return;
  var n=getPending().length;
  G('ndot').textContent=n;
  G('nwrap').style.display=n>0?'':'none';
  G('pend-n').textContent=n; G('pend-n').style.display=n>0?'':'none';
}

function setupRT(){
  db.channel('rt').on('postgres_changes',{event:'*',schema:'public',table:'events'},async function(){
    await loadAll(); renderCal(); refreshBadge();
    var cur=document.querySelector('.tab.on');
    if(cur&&cur.dataset.tab==='pending') renderPending();
    if(cur&&cur.dataset.tab==='team') renderTeam();
  }).on('postgres_changes',{event:'*',schema:'public',table:'shifts'},async function(){
    await loadAll(); renderCal(); renderShifts();
  }).subscribe();
}

function goTab(name){
  ['planning','pending','shifts','team'].forEach(function(n){ G('view-'+n).style.display=n===name?'block':'none'; });
  document.querySelectorAll('.tab').forEach(function(t){ t.classList.toggle('on',t.dataset.tab===name); });
  if(name==='pending') renderPending();
  if(name==='shifts') renderShifts();
  if(name==='team') renderTeam();
}

function navMonth(d){ curDate=new Date(curDate.getFullYear(),curDate.getMonth()+d,1); closeWasgn(); renderCal(); }
function navToday(){ curDate=new Date(NOW.getFullYear(),NOW.getMonth(),1); closeWasgn(); renderCal(); }

function evForDay(empId,ds){
  for(var i=0;i<allEvents.length;i++){
    var e=allEvents[i];
    if(e.employee_id===empId&&e.date===ds&&e.status!=='rejected') return e;
  }
  return null;
}
function shiftById(id){
  for(var i=0;i<allShifts.length;i++){ if(allShifts[i].id===id) return allShifts[i]; }
  return null;
}

function renderCal(){
  var year=curDate.getFullYear(), month=curDate.getMonth();
  G('cal-label').textContent=MON[month]+' '+year;
  var first=new Date(year,month,1);
  var startDay=first.getDay();
  var off=startDay===0?6:startDay-1;
  var h='';
  h+='<div class="dh" style="background:var(--s3)"></div>';
  for(var i=0;i<7;i++) h+='<div class="dh">'+DFR[i]+'</div>';
  var d=new Date(first); d.setDate(1-off);
  var maxRows=6;
  for(var row=0;row<maxRows;row++){
    var mon=monOf(d);
    var wkDates=[];
    for(var wi=0;wi<7;wi++) wkDates.push(dk(addD(mon,wi)));
    var isSel=selWeekDays.length>0&&selWeekDays[0]===wkDates[0];
    var wn=getWN(mon);
    h+='<div class="wkc'+(isSel?' on':'')+'" onclick="selectWeek(\''+wkDates[0]+'\')" title="Cliquer pour assigner"><span class="wn">S'+wn+'</span></div>';
    for(var di=0;di<7;di++){
      var dd=wkDates[di];
      var dobj=addD(mon,di);
      var other=dobj.getMonth()!==month;
      var isTod=dd===dk(NOW);
      h+='<div class="dc'+(other?' other':'')+(isTod?' today':'')+(isSel?' hi':'')+'">';
      h+='<div class="dn">'+dobj.getDate()+'</div>';
      if(isAdmin()){
        for(var pi=0;pi<allProfiles.length;pi++){
          var emp=allProfiles[pi];
          var ev=evForDay(emp.id,dd);
          if(!ev) continue;
          var sh=shiftById(ev.shift_id);
          if(!sh) continue;
          var isPend=ev.status==='pending';
          var bg=isPend?'var(--oral)':BG[sh.color||0];
          var tx=isPend?'var(--ora)':TX[sh.color||0];
          var nm=(emp.full_name||emp.email||'?').split(' ')[0];
          h+='<div class="chip" style="background:'+bg+';color:'+tx+';border-left-color:'+tx+'">';
          h+='<span>'+(isPend?'&#x23F3; ':'')+esc(nm)+'</span>';
          h+='<span class="cx" onclick="event.stopPropagation();qDel(\''+ev.id+'\')">&#x2715;</span>';
          h+='</div>';
        }
      } else {
        var myev=evForDay(me.id,dd);
        if(myev){
          var mysh=shiftById(myev.shift_id);
          if(mysh){
            h+='<div class="chip" style="background:'+BG[mysh.color||0]+';color:'+TX[mysh.color||0]+';border-left-color:'+TX[mysh.color||0]+'">';
            h+='<span>'+esc(mysh.name)+'</span></div>';
          }
        }
      }
      h+='</div>';
    }
    d=addD(mon,7);
    if(d.getMonth()>month&&month!==11) break;
    if(d.getFullYear()>year&&month===11) break;
  }
  G('mgrid').innerHTML=h;
  renderLegend();
}

function getWN(d){
  var jan1=new Date(d.getFullYear(),0,1);
  return Math.ceil(((d-jan1)/86400000+jan1.getDay()+1)/7);
}

function selectWeek(mondayStr){
  if(!isAdmin()) return;
  var mon=new Date(mondayStr+'T12:00');
  var days=[];
  for(var i=0;i<7;i++) days.push(dk(addD(mon,i)));
  selWeekDays=days;
  var d6=new Date(days[6]+'T12:00');
  G('wa-title').textContent='Semaine du '+mon.getDate()+' au '+d6.getDate()+' '+MON[d6.getMonth()]+' '+d6.getFullYear();
  G('wasgn').style.display='block';
  G('wa-msg').textContent='';
  var es=G('wa-emp');
  es.innerHTML='<option value="">-- Choisir employe --</option>';
  allProfiles.forEach(function(p){
    var o=document.createElement('option');
    o.value=p.id; o.textContent=p.full_name||p.email; es.appendChild(o);
  });
  var ss=G('wa-shift');
  ss.innerHTML='<option value="">-- Choisir creneau --</option>';
  allShifts.forEach(function(s){
    var o=document.createElement('option');
    o.value=s.id;
    o.textContent=s.name+(s.time_start?' ('+s.time_start.slice(0,5)+'-'+(s.time_end||'').slice(0,5)+')':'');
    ss.appendChild(o);
  });
  var dr=G('days-row');
  dr.innerHTML='';
  DFULL.forEach(function(name,i){
    var btn=document.createElement('button');
    btn.className='db on';
    btn.textContent=DFR[i];
    btn.dataset.idx=i;
    btn.onclick=function(){ this.classList.toggle('on'); };
    dr.appendChild(btn);
  });
  renderCal();
  G('wasgn').scrollIntoView({behavior:'smooth',block:'nearest'});
}

function closeWasgn(){ selWeekDays=[]; G('wasgn').style.display='none'; renderCal(); }

async function applyWeek(){
  var empId=G('wa-emp').value, shiftId=G('wa-shift').value;
  if(!empId||!shiftId){ G('wa-msg').textContent='Choisissez employe et creneau.'; return; }
  var active=[];
  G('days-row').querySelectorAll('.db.on').forEach(function(b){ active.push(parseInt(b.dataset.idx)); });
  if(!active.length){ G('wa-msg').textContent='Selectionnez au moins un jour.'; return; }
  G('wa-msg').textContent='Enregistrement...';
  var count=0;
  for(var i=0;i<active.length;i++){
    var ds=selWeekDays[active[i]];
    if(!ds) continue;
    var existing=evForDay(empId,ds);
    try{
      if(existing){ await db.from('events').update({shift_id:shiftId,status:'approved',updated_by:me.id}).eq('id',existing.id); }
      else{ await db.from('events').insert({employee_id:empId,date:ds,shift_id:shiftId,status:'approved',created_by:me.id}); }
      count++;
    }catch(x){}
  }
  toast(count+' jour(s) assigne(s)');
  G('wa-msg').textContent=count+' jours enregistres.';
  await loadAll(); renderCal(); refreshBadge();
}

async function qDel(evId){
  if(!confirm('Effacer ce creneau ?')) return;
  try{ await db.from('events').delete().eq('id',evId); }catch(x){}
  toast('Efface'); await loadAll(); renderCal();
}

function renderLegend(){
  var used={};
  allEvents.forEach(function(e){ if(e.shift_id) used[e.shift_id]=true; });
  var h='';
  allShifts.filter(function(s){ return used[s.id]; }).forEach(function(s){
    var hrs=s.time_start?' ('+s.time_start.slice(0,5)+'-'+(s.time_end||'').slice(0,5)+')':'';
    h+='<div class="lgi"><div class="lgd" style="background:'+BG[s.color||0]+'"></div>'+esc(s.name)+hrs+'</div>';
  });
  G('legend').innerHTML=h;
}

function renderPending(){
  var list=getPending(), el=G('pend-list');
  if(!list.length){ el.innerHTML='<div class="empty">Aucune demande en attente</div>'; return; }
  var h='';
  list.forEach(function(ev){
    var emp=null, sh=null;
    for(var i=0;i<allProfiles.length;i++){ if(allProfiles[i].id===ev.employee_id){ emp=allProfiles[i]; break; } }
    for(var i=0;i<allShifts.length;i++){ if(allShifts[i].id===ev.shift_id){ sh=allShifts[i]; break; } }
    var who=emp?(emp.full_name||emp.email):'-';
    var what=sh?sh.name:'-';
    var dd=new Date((ev.date||'')+'T12:00');
    var ds=isNaN(dd)?'-':DFR[dd.getDay()===0?6:dd.getDay()-1]+' '+dd.getDate()+' '+MON[dd.getMonth()];
    var col=sh?(sh.color||0):0;
    h+='<div class="rcard"><div class="rbar" style="background:'+BG[col]+'"></div>';
    h+='<div class="rinfo"><h4>'+esc(what)+' - '+esc(who)+'</h4><p>'+ds+'</p></div>';
    h+='<div class="ract"><button class="btn grn sm" onclick="approve(\''+ev.id+'\')">Approuver</button><button class="btn red sm" onclick="reject(\''+ev.id+'\')">Rejeter</button></div></div>';
  });
  el.innerHTML=h;
}
async function approve(id){
  try{ await db.from('events').update({status:'approved'}).eq('id',id); }catch(x){}
  toast('Approuve'); await loadAll(); renderCal(); renderPending(); refreshBadge();
}
async function reject(id){
  if(!confirm('Rejeter ?')) return;
  try{ await db.from('events').update({status:'rejected'}).eq('id',id); }catch(x){}
  toast('Rejete'); await loadAll(); renderCal(); renderPending(); refreshBadge();
}

function renderShifts(){
  var el=G('shift-list');
  if(!allShifts.length){ el.innerHTML='<div class="empty">Aucun creneau</div>'; return; }
  var h='';
  allShifts.forEach(function(s){
    var hrs=s.time_start?s.time_start.slice(0,5)+' - '+(s.time_end||'').slice(0,5):'';
    h+='<div class="sitem" onclick="openShiftModal(\''+s.id+'\')">';
    h+='<div class="sw" style="background:'+BG[s.color||0]+'"></div>';
    h+='<span style="flex:1;font-size:.82rem;font-weight:500">'+esc(s.name)+'</span>';
    h+='<span style="font-size:.72rem;color:var(--t2)">'+hrs+'</span></div>';
  });
  el.innerHTML=h;
}
function openShiftModal(id){
  editShiftId=id||null;
  var s=null;
  if(id){ for(var i=0;i<allShifts.length;i++){ if(allShifts[i].id===id){ s=allShifts[i]; break; } } }
  G('sm-title').textContent=s?'Modifier':'Nouveau creneau';
  G('sm-name').value=s?s.name:'';
  G('sm-start').value=s?(s.time_start||''):'';
  G('sm-end').value=s?(s.time_end||''):'';
  smColor=s?(s.color||0):0;
  G('sm-del').style.display=s?'':'none';
  buildCG();
  G('ov-shift').style.display='flex';
  setTimeout(function(){ G('sm-name').focus(); },50);
}
function closeShiftModal(){ G('ov-shift').style.display='none'; editShiftId=null; }
function buildCG(){
  var h='';
  for(var i=0;i<BG.length;i++){
    h+='<div class="copt'+(i===smColor?' on':'')+'" style="background:'+BG[i]+'" onclick="smColor='+i+';buildCG()"></div>';
  }
  G('sm-colors').innerHTML=h;
}
async function saveShift(){
  var name=G('sm-name').value.trim();
  if(!name){ G('sm-name').style.boxShadow='0 0 0 2px var(--red)'; return; }
  G('sm-name').style.boxShadow='';
  var payload={name:name,color:smColor,time_start:G('sm-start').value||null,time_end:G('sm-end').value||null,created_by:me.id};
  try{
    if(editShiftId){ await db.from('shifts').update(payload).eq('id',editShiftId); toast('Modifie'); }
    else{ await db.from('shifts').insert(payload); toast('Creneau cree'); }
  }catch(x){ toast('Erreur: '+x.message); return; }
  closeShiftModal(); await loadAll(); renderShifts(); renderCal();
}
async function deleteShift(){
  if(!editShiftId||!confirm('Supprimer ce creneau ?')) return;
  try{ await db.from('events').delete().eq('shift_id',editShiftId); await db.from('shifts').delete().eq('id',editShiftId); toast('Supprime'); }catch(x){}
  closeShiftModal(); await loadAll(); renderShifts(); renderCal();
}

function renderTeam(){
  if(!allProfiles.length){ G('team-body').innerHTML='<div class="empty">Aucun membre</div>'; return; }
  var h='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.65rem">';
  allProfiles.forEach(function(p){
    var ap=allEvents.filter(function(e){ return e.employee_id===p.id&&e.status==='approved'; }).length;
    var pn=allEvents.filter(function(e){ return e.employee_id===p.id&&e.status==='pending'; }).length;
    var init=(p.full_name||p.email||'?')[0].toUpperCase();
    h+='<div style="background:var(--surf);border:1px solid var(--b2);border-radius:var(--rl);padding:.85rem">';
    h+='<div style="display:flex;align-items:center;gap:.55rem;margin-bottom:.5rem">';
    h+='<div style="width:32px;height:32px;border-radius:50%;background:var(--accl);color:var(--acc);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.82rem">'+init+'</div>';
    h+='<div><div style="font-size:.82rem;font-weight:600">'+esc(p.full_name||p.email)+'</div><span class="rbadge '+p.role+'">'+p.role+'</span></div></div>';
    h+='<div style="font-size:.74rem;color:var(--t2)">'+ap+' shift(s)';
    if(pn) h+=' - <span style="color:var(--ora)">'+pn+' en attente</span>';
    h+='</div></div>';
  });
  G('team-body').innerHTML=h+'</div>';
}

document.addEventListener('keydown',function(e){ if(e.key==='Escape'){ closeShiftModal(); closeWasgn(); } });

db.auth.onAuthStateChange(function(evt,session){
  if(session&&session.user){ initApp(session.user); }
  else{ G('pg-auth').style.display='flex'; G('pg-app').style.display='none'; me=null; myProfile=null; }
});
</script>
</body>
