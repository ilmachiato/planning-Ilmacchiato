<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Planning Entreprise</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>📅</text></svg>"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f8f7f4;--surface:#ffffff;--surface2:#f2f1ee;--surface3:#e8e7e3;
  --text:#1c1b18;--text2:#5a5955;--text3:#9a9895;
  --border:rgba(0,0,0,.08);--border2:rgba(0,0,0,.15);
  --accent:#2563EB;--accent-hover:#1d4ed8;--accent-light:#EEF3FE;
  --green:#16a34a;--green-light:#dcfce7;
  --orange:#ea580c;--orange-light:#fff7ed;
  --red:#dc2626;--red-light:#fef2f2;
  --r:8px;--rl:12px;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);
}
@media(prefers-color-scheme:dark){:root{
  --bg:#111110;--surface:#1c1b18;--surface2:#28271f;--surface3:#353430;
  --text:#e8e6e0;--text2:#a8a69f;--text3:#5a5955;
  --border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.14);
  --accent-light:#1e2d4a;--green-light:#14271c;--orange-light:#2a1a0a;--red-light:#2a1212;
}}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
/* AUTH */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}
.auth-card{background:var(--surface);border:1px solid var(--border2);border-radius:var(--rl);padding:2rem;width:380px;max-width:100%;box-shadow:var(--shadow)}
.auth-logo{font-size:2rem;margin-bottom:.5rem}
.auth-card h1{font-size:1.4rem;font-weight:700;margin-bottom:.25rem}
.auth-card p{font-size:.875rem;color:var(--text2);margin-bottom:1.5rem}
.field{margin-bottom:1rem}
.field label{display:block;font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text2);margin-bottom:.35rem}
.field input{width:100%;padding:.65rem .85rem;border:1px solid var(--border2);border-radius:var(--r);background:var(--surface);color:var(--text);font-size:.9rem;outline:none;transition:border .15s,box-shadow .15s}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.65rem 1.2rem;border-radius:var(--r);font-size:.875rem;font-weight:500;cursor:pointer;border:1px solid var(--border2);background:var(--surface);color:var(--text);transition:all .15s}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;width:100%;justify-content:center}
.btn.primary:hover{background:var(--accent-hover)}
.btn.sm{padding:.4rem .85rem;font-size:.8rem}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.danger:hover{background:var(--red-light)}
.btn.success{background:var(--green);border-color:var(--green);color:#fff}
.btn.success:hover{opacity:.9}
.auth-toggle{text-align:center;margin-top:1rem;font-size:.85rem;color:var(--text2)}
.auth-toggle a{color:var(--accent);cursor:pointer;font-weight:500}
.err{background:var(--red-light);color:var(--red);border:1px solid rgba(220,38,38,.2);border-radius:var(--r);padding:.65rem .85rem;font-size:.85rem;margin-bottom:1rem;display:none}
/* APP LAYOUT */
.app{display:flex;flex-direction:column;min-height:100vh}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:.75rem 1.5rem;display:flex;align-items:center;gap:1rem;position:sticky;top:0;z-index:40}
.topbar-logo{font-weight:700;font-size:1rem;display:flex;align-items:center;gap:.5rem}
.topbar-nav{display:flex;gap:.5rem;margin-left:auto;align-items:center}
.badge-wrap{position:relative;display:inline-flex}
.badge{position:absolute;top:-5px;right:-5px;background:var(--red);color:#fff;border-radius:50%;width:16px;height:16px;font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:700}
.user-chip{display:flex;align-items:center;gap:.5rem;font-size:.85rem;padding:.4rem .75rem;border-radius:var(--r);border:1px solid var(--border);background:var(--surface2)}
.role-badge{font-size:.7rem;padding:2px 7px;border-radius:20px;font-weight:600}
.role-badge.admin{background:var(--accent-light);color:var(--accent)}
.role-badge.manager{background:var(--green-light);color:var(--green)}
.role-badge.employee{background:var(--surface3);color:var(--text2)}
/* MAIN CONTENT */
.main{flex:1;padding:1.5rem;max-width:1200px;margin:0 auto;width:100%}
/* CALENDAR */
.cal-header{display:flex;align-items:center;gap:.75rem;margin-bottom:1.25rem;flex-wrap:wrap}
.cal-header h2{font-size:1.1rem;font-weight:700;min-width:180px}
.cal-nav{display:flex;gap:.35rem;align-items:center}
.cal-nav button{padding:.4rem .8rem;border:1px solid var(--border2);border-radius:var(--r);background:none;color:var(--text);cursor:pointer;font-size:.85rem}
.cal-nav button:hover{background:var(--surface2)}
.view-tabs{display:flex;gap:.3rem;margin-left:auto}
.view-tabs button{padding:.4rem .9rem;border:1px solid var(--border2);border-radius:var(--r);background:none;color:var(--text2);cursor:pointer;font-size:.8rem;font-weight:500}
.view-tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
/* MONTH GRID */
.month-grid{background:var(--border);display:grid;grid-template-columns:repeat(7,1fr);gap:1px;border:1px solid var(--border2);border-radius:var(--rl);overflow:hidden}
.dh{background:var(--surface2);text-align:center;padding:.5rem;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text2)}
.dc{background:var(--surface);min-height:100px;padding:.45rem;cursor:pointer;transition:background .1s}
.dc:hover{background:var(--surface2)}
.dc.other .dn{color:var(--text3)}
.dc.today .dn{background:var(--accent);color:#fff;border-radius:50%}
.dn{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:600;margin-bottom:.3rem}
.chip{font-size:.7rem;padding:2px 5px;border-radius:3px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;border-left:2px solid transparent;transition:opacity .1s}
.chip:hover{opacity:.8}
.chip.pending{opacity:.85}
.morechip{font-size:.68rem;color:var(--text3);padding:1px 3px}
/* WEEK VIEW */
.week-wrap{border:1px solid var(--border2);border-radius:var(--rl);overflow:hidden}
.week-head{display:grid;grid-template-columns:52px repeat(7,1fr);background:var(--border);gap:1px}
.wdh{background:var(--surface2);padding:.6rem .3rem;text-align:center;font-size:.75rem;color:var(--text2)}
.wdh.today{color:var(--accent);font-weight:700}
.week-body{display:grid;grid-template-columns:52px repeat(7,1fr);background:var(--border);gap:1px;max-height:500px;overflow-y:auto}
.tl{background:var(--surface2);font-size:.65rem;color:var(--text3);padding:3px 5px;height:40px;display:flex;align-items:flex-start;justify-content:flex-end}
.ws{background:var(--surface);height:40px;position:relative;cursor:pointer}
.ws:hover{background:var(--surface2)}
.we{position:absolute;left:1px;right:1px;border-radius:3px;font-size:.65rem;padding:1px 3px;overflow:hidden;cursor:pointer;z-index:2;border-left:2px solid}
/* PENDING PANEL */
.panel-title{font-size:1rem;font-weight:700;margin-bottom:1rem;display:flex;align-items:center;gap:.5rem}
.req-list{display:flex;flex-direction:column;gap:.65rem}
.req-card{background:var(--surface);border:1px solid var(--border2);border-radius:var(--rl);padding:1rem;display:flex;align-items:center;gap:1rem}
.req-color{width:4px;align-self:stretch;border-radius:2px;flex-shrink:0}
.req-info{flex:1;min-width:0}
.req-info h4{font-size:.9rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.req-info p{font-size:.78rem;color:var(--text2);margin-top:2px}
.req-actions{display:flex;gap:.5rem;flex-shrink:0}
/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:1rem;backdrop-filter:blur(3px)}
.modal{background:var(--surface);border-radius:var(--rl);padding:1.5rem;width:400px;max-width:100%;border:1px solid var(--border2);box-shadow:0 20px 60px rgba(0,0,0,.2);animation:modalIn .18s ease}
@keyframes modalIn{from{opacity:0;transform:translateY(-12px) scale(.97)}to{opacity:1;transform:none}}
.modal h2{font-size:1rem;font-weight:700;margin-bottom:1.1rem}
.modal label{font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text2);display:block;margin-bottom:.3rem}
.modal input,.modal select,.modal textarea{width:100%;padding:.6rem .8rem;border:1px solid var(--border2);border-radius:var(--r);background:var(--surface);color:var(--text);font-size:.875rem;outline:none;margin-bottom:.9rem}
.modal input:focus,.modal select:focus,.modal textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.modal textarea{resize:vertical;min-height:60px}
.modal-row{display:flex;gap:.75rem}
.modal-row>*{flex:1}
.modal-foot{display:flex;justify-content:flex-end;gap:.5rem;margin-top:.5rem;align-items:center}
.color-row{display:flex;gap:.5rem;margin-bottom:.9rem;flex-wrap:wrap}
.cdot{width:24px;height:24px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:transform .1s}
.cdot:hover,.cdot.on{transform:scale(1.15);border-color:var(--text)}
/* STATUS */
.status-pill{font-size:.7rem;padding:2px 8px;border-radius:20px;font-weight:600;white-space:nowrap}
.status-pill.approved{background:var(--green-light);color:var(--green)}
.status-pill.pending{background:var(--orange-light);color:var(--orange)}
.status-pill.rejected{background:var(--red-light);color:var(--red)}
/* TABS */
.tabs{display:flex;gap:0;margin-bottom:1.25rem;border-bottom:1px solid var(--border)}
.tab{padding:.65rem 1.1rem;font-size:.875rem;cursor:pointer;border-bottom:2px solid transparent;color:var(--text2);font-weight:500;transition:all .15s;display:flex;align-items:center;gap:.4rem}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
/* TOAST */
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:.6rem 1.25rem;border-radius:20px;font-size:.85rem;z-index:200;opacity:0;pointer-events:none;transition:opacity .25s;white-space:nowrap}
.toast.show{opacity:1}
/* FAB */
.fab{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--accent);color:#fff;border:none;border-radius:50%;width:52px;height:52px;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(37,99,235,.4);z-index:50;transition:background .15s,transform .1s}
.fab:hover{background:var(--accent-hover);transform:scale(1.07)}
/* EMPTY */
.empty{text-align:center;padding:3rem 1rem;color:var(--text3)}
.empty .ico{font-size:2.5rem;margin-bottom:.75rem}
/* RESPONSIVE */
@media(max-width:640px){
  .dc{min-height:65px}.chip{display:none}
  .main{padding:.75rem}
  .topbar{padding:.65rem .85rem}
}
</style>
</head>
<body>

<!-- AUTH SCREEN -->
<div id="auth-screen" class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">📅</div>
    <h1>Planning Entreprise</h1>
    <p id="auth-sub">Connectez-vous à votre espace</p>
    <div class="err" id="auth-err"></div>
    <div id="register-only" style="display:none">
      <div class="field"><label>Nom complet</label><input id="inp-name" placeholder="Jean Dupont" autocomplete="name"/></div>
    </div>
    <div class="field"><label>Email</label><input id="inp-email" type="email" placeholder="vous@entreprise.com" autocomplete="email"/></div>
    <div class="field"><label>Mot de passe</label><input id="inp-pass" type="password" placeholder="••••••••" autocomplete="current-password"/></div>
    <button class="btn primary" onclick="authAction()" id="auth-btn">Se connecter</button>
    <div class="auth-toggle"><span id="auth-toggle-text">Pas encore de compte ?</span> <a onclick="toggleAuthMode()">S'inscrire</a></div>
  </div>
</div>

<!-- MAIN APP (hidden until login) -->
<div id="main-app" class="app" style="display:none">
  <div class="topbar">
    <div class="topbar-logo">📅 <span>Planning</span></div>
    <div class="topbar-nav">
      <div id="notif-wrap" class="badge-wrap" style="display:none">
        <button class="btn sm" onclick="showTab('pending')" id="notif-btn">⏳ Demandes</button>
        <span class="badge" id="notif-count">0</span>
      </div>
      <div class="user-chip">
        <span id="user-name-display">—</span>
        <span class="role-badge" id="user-role-badge">—</span>
      </div>
      <button class="btn sm" onclick="logout()">Déconnexion</button>
    </div>
  </div>

  <div class="main">
    <!-- TABS -->
    <div class="tabs" id="tab-bar">
      <div class="tab on" onclick="showTab('calendar')" data-tab="calendar">📅 Calendrier</div>
      <div class="tab" onclick="showTab('pending')" data-tab="pending" id="nav-pending" style="display:none">⏳ Demandes <span id="tab-count" style="background:var(--orange-light);color:var(--orange);border-radius:20px;padding:1px 7px;font-size:.7rem;font-weight:700"></span></div>
      <div class="tab" onclick="showTab('team')" data-tab="team" id="nav-team" style="display:none">👥 Équipe</div>
    </div>

    <!-- CALENDAR TAB -->
    <div id="tab-calendar">
      <div class="cal-header">
        <div class="cal-nav">
          <button onclick="changeMonth(-1)">&#8592;</button>
          <h2 id="month-label"></h2>
          <button onclick="changeMonth(1)">&#8594;</button>
          <button onclick="goToday()" style="font-size:.75rem">Aujourd'hui</button>
        </div>
        <div class="view-tabs" style="margin-left:auto">
          <button class="on" onclick="setView('month',this)">Mois</button>
          <button onclick="setView('week',this)">Semaine</button>
        </div>
      </div>
      <div id="cal-container"></div>
    </div>

    <!-- PENDING TAB (admin/manager) -->
    <div id="tab-pending" style="display:none">
      <div class="panel-title">⏳ Demandes en attente <span id="pend-count-badge" class="status-pill pending">0</span></div>
      <div class="req-list" id="pending-list"><div class="empty"><div class="ico">✅</div>Aucune demande en attente</div></div>
    </div>

    <!-- TEAM TAB (admin/manager) -->
    <div id="tab-team" style="display:none">
      <div class="panel-title">👥 Membres de l'équipe</div>
      <div id="team-list"></div>
    </div>
  </div>
</div>

<!-- FAB -->
<button class="fab" id="fab" onclick="openAdd()" title="Nouvelle demande" style="display:none">+</button>

<!-- EVENT MODAL -->
<div class="overlay" id="overlay" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <h2 id="modal-title">Nouvelle demande</h2>
    <label>Titre *</label>
    <input id="ev-title" placeholder="Réunion, Absence, Formation…" autocomplete="off"/>
    <div class="modal-row">
      <div><label>Date</label><input id="ev-date" type="date"/></div>
      <div><label>Heure</label><input id="ev-time" type="time"/></div>
    </div>
    <label>Durée</label>
    <select id="ev-dur">
      <option value="30">30 min</option>
      <option value="60" selected>1 heure</option>
      <option value="90">1h 30</option>
      <option value="120">2 heures</option>
      <option value="240">Demi-journée</option>
      <option value="480">Journée entière</option>
    </select>
    <div id="employee-select-wrap" style="display:none">
      <label>Employé concerné</label>
      <select id="ev-employee"></select>
    </div>
    <label>Note / Motif</label>
    <textarea id="ev-note" placeholder="Précisez le motif ou la description…"></textarea>
    <label>Couleur</label>
    <div class="color-row" id="color-row"></div>
    <div id="admin-direct-wrap" style="display:none">
      <label style="display:flex;align-items:center;gap:.5rem;cursor:pointer;text-transform:none;letter-spacing:0;color:var(--text2);font-size:.85rem;margin-bottom:.9rem">
        <input type="checkbox" id="ev-direct" style="width:auto;margin:0"/> Approuver directement (sans validation)
      </label>
    </div>
    <div class="modal-foot">
      <button class="btn danger" id="btn-del" onclick="deleteEvent()" style="display:none;margin-right:auto">🗑 Supprimer</button>
      <button class="btn" onclick="closeModal()">Annuler</button>
      <button class="btn primary" onclick="saveEvent()">Enregistrer</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===================== CONFIG — REMPLACE CES 2 LIGNES =====================
const SUPABASE_URL = 'https://VOTRE_URL.supabase.co';
const SUPABASE_KEY = 'VOTRE_CLE_ANON';
// =========================================================================

const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

// ---- STATE ----
let currentUser = null, currentProfile = null;
let events = [], profiles = [], pendingEvents = [];
let cur = new Date(), viewMode = 'month', editId = null, selColor = 0;
let authMode = 'login';
const today = new Date();

const COLORS = [
  {bg:'#DBEAFE',text:'#1e40af',border:'#3B82F6'},
  {bg:'#DCFCE7',text:'#15803d',border:'#22c55e'},
  {bg:'#FEF9C3',text:'#854d0e',border:'#eab308'},
  {bg:'#FFE4E6',text:'#9f1239',border:'#f43f5e'},
  {bg:'#EDE9FE',text:'#5b21b6',border:'#8b5cf6'},
  {bg:'#FFEDD5',text:'#9a3412',border:'#f97316'},
  {bg:'#E0F2FE',text:'#075985',border:'#0ea5e9'},
  {bg:'#F3F4F6',text:'#374151',border:'#9ca3af'},
];
const DAYS = ['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
const MONTHS = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];

// ---- UTILS ----
function toKey(d){return d.toISOString().slice(0,10)}
function sameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate()}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function isAdmin(){return currentProfile&&(currentProfile.role==='admin'||currentProfile.role==='manager')}

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2500);
}

// ---- AUTH ----
function toggleAuthMode(){
  authMode = authMode==='login'?'register':'login';
  document.getElementById('auth-btn').textContent = authMode==='login'?'Se connecter':"S'inscrire";
  document.getElementById('auth-sub').textContent = authMode==='login'?'Connectez-vous à votre espace':'Créez votre compte';
  document.getElementById('register-only').style.display = authMode==='register'?'block':'none';
  document.getElementById('auth-toggle-text').textContent = authMode==='login'?'Pas encore de compte ?':'Déjà un compte ?';
  document.querySelector('.auth-toggle a').textContent = authMode==='login'?"S'inscrire":'Se connecter';
  document.getElementById('auth-err').style.display='none';
}

function showErr(msg){
  const e=document.getElementById('auth-err');
  e.textContent=msg;e.style.display='block';
}

async function authAction(){
  const email=document.getElementById('inp-email').value.trim();
  const pass=document.getElementById('inp-pass').value;
  const name=document.getElementById('inp-name').value.trim();
  document.getElementById('auth-err').style.display='none';
  if(!email||!pass){showErr('Email et mot de passe requis.');return;}
  if(authMode==='register'&&!name){showErr('Nom complet requis.');return;}
  document.getElementById('auth-btn').textContent='...';
  if(authMode==='login'){
    const{data,error}=await db.auth.signInWithPassword({email,password:pass});
    if(error){showErr('Identifiants incorrects.');document.getElementById('auth-btn').textContent='Se connecter';}
  } else {
    const{data,error}=await db.auth.signUp({email,password:pass,options:{data:{full_name:name}}});
    if(error){showErr(error.message);document.getElementById('auth-btn').textContent="S'inscrire";}
    else toast('Compte créé ! Vous pouvez vous connecter.');
  }
}

async function logout(){
  await db.auth.signOut();
  currentUser=null;currentProfile=null;
  document.getElementById('main-app').style.display='none';
  document.getElementById('auth-screen').style.display='flex';
  document.getElementById('fab').style.display='none';
}

// ---- INIT AFTER LOGIN ----
async function initApp(user){
  currentUser=user;
  // load profile
  const{data}=await db.from('profiles').select('*').eq('id',user.id).single();
  currentProfile=data;

  // show UI
  document.getElementById('auth-screen').style.display='none';
  document.getElementById('main-app').style.display='flex';
  document.getElementById('fab').style.display='flex';

  // update topbar
  document.getElementById('user-name-display').textContent=currentProfile?.full_name||user.email;
  const rb=document.getElementById('user-role-badge');
  rb.textContent=currentProfile?.role||'employee';
  rb.className='role-badge '+(currentProfile?.role||'employee');

  // admin-only tabs
  if(isAdmin()){
    document.getElementById('nav-pending').style.display='';
    document.getElementById('nav-team').style.display='';
    document.getElementById('notif-wrap').style.display='';
  }

  await loadData();
  setupRealtime();
  render();
}

// ---- DATA ----
async function loadData(){
  const{data:evs}=await db.from('events').select('*').order('date',{ascending:true});
  events=evs||[];
  if(isAdmin()){
    const{data:pr}=await db.from('profiles').select('*').order('full_name');
    profiles=pr||[];
  }
  updatePendingCount();
}

function pendingList(){return events.filter(e=>e.status==='pending')}

function updatePendingCount(){
  const n=pendingList().length;
  document.getElementById('notif-count').textContent=n;
  document.getElementById('tab-count').textContent=n||'';
  document.getElementById('pend-count-badge').textContent=n;
  document.getElementById('notif-wrap').style.display=isAdmin()&&n>0?'':'none';
  if(!isAdmin())document.getElementById('notif-wrap').style.display='none';
}

function setupRealtime(){
  db.channel('events-changes')
    .on('postgres_changes',{event:'*',schema:'public',table:'events'},async()=>{
      await loadData();render();renderPending();renderTeam();
    }).subscribe();
}

// ---- RENDER ----
function showTab(name){
  ['calendar','pending','team'].forEach(t=>{
    document.getElementById('tab-'+t).style.display=t===name?'block':'none';
  });
  document.querySelectorAll('.tab').forEach(t=>{
    t.classList.toggle('on',t.dataset.tab===name);
  });
  if(name==='pending')renderPending();
  if(name==='team')renderTeam();
}

function render(){
  document.getElementById('month-label').textContent=
    viewMode==='month'?MONTHS[cur.getMonth()]+' '+cur.getFullYear():getWeekLabel();
  document.getElementById('cal-container').innerHTML=viewMode==='month'?renderMonth():renderWeek();
}

function getWeekLabel(){
  let d=new Date(cur);d.setDate(d.getDate()-d.getDay());
  let end=new Date(d);end.setDate(end.getDate()+6);
  return d.getDate()+' – '+end.getDate()+' '+MONTHS[end.getMonth()]+' '+end.getFullYear();
}

function changeMonth(d){
  if(viewMode==='month')cur.setMonth(cur.getMonth()+d);
  else cur.setDate(cur.getDate()+d*7);
  render();
}
function goToday(){cur=new Date(today.getFullYear(),today.getMonth(),1);render();}
function setView(v,btn){
  viewMode=v;
  document.querySelectorAll('.view-tabs button').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');render();
}

function eventsForDate(ds){
  // employee sees own + approved events; admin sees all
  return events.filter(e=>{
    if(e.date!==ds)return false;
    if(isAdmin())return true;
    if(e.employee_id===currentUser.id)return true;
    return e.status==='approved';
  });
}

function renderMonth(){
  let first=new Date(cur.getFullYear(),cur.getMonth(),1);
  let startDay=first.getDay();
  let h='<div class="month-grid">';
  DAYS.forEach(d=>h+=`<div class="dh">${d}</div>`);
  let d=new Date(first);d.setDate(1-startDay);
  for(let i=0;i<42;i++){
    let ds=toKey(d);
    let other=d.getMonth()!==cur.getMonth();
    let isTod=sameDay(d,today);
    let dd=new Date(d);
    h+=`<div class="dc${other?' other':''}${isTod?' today':''}" onclick="openAdd('${ds}')">`;
    h+=`<div class="dn">${d.getDate()}</div>`;
    let evs=eventsForDate(ds);
    evs.slice(0,3).forEach(ev=>{
      let c=COLORS[ev.color||0];
      let isPend=ev.status==='pending';
      let dot=isPend?'⏳ ':'';
      h+=`<div class="chip${isPend?' pending':''}" style="background:${isPend?'var(--orange-light)':c.bg};color:${isPend?'var(--orange)':c.text};border-left-color:${isPend?'var(--orange)':c.border}" onclick="event.stopPropagation();openEdit('${ev.id}')" title="${esc(ev.title)}">${dot}${ev.time_start?ev.time_start.slice(0,5)+' ':''}<b style="font-weight:500">${esc(ev.title)}</b></div>`;
    });
    if(evs.length>3)h+=`<div class="morechip">+${evs.length-3}</div>`;
    h+='</div>';
    d.setDate(d.getDate()+1);
  }
  return h+'</div>';
}

function renderWeek(){
  let d=new Date(cur);d.setDate(d.getDate()-d.getDay());
  let days=[];for(let i=0;i<7;i++){let dd=new Date(d);dd.setDate(dd.getDate()+i);days.push(dd);}
  let h='<div class="week-wrap"><div class="week-head"><div class="tl" style="background:var(--surface2)"></div>';
  days.forEach(dd=>{
    let isTod=sameDay(dd,today);
    h+=`<div class="wdh${isTod?' today':''}">${DAYS[dd.getDay()]}<br><span style="font-size:1rem;font-weight:700">${dd.getDate()}</span></div>`;
  });
  h+='</div><div class="week-body">';
  for(let hr=6;hr<22;hr++){
    h+=`<div class="tl">${String(hr).padStart(2,'0')}h</div>`;
    days.forEach(dd=>{
      let ds=toKey(dd);
      let slotEvs=eventsForDate(ds).filter(e=>e.time_start&&parseInt(e.time_start.split(':')[0])===hr);
      h+=`<div class="ws" onclick="openAdd('${ds}','${String(hr).padStart(2,'0')}:00')">`;
      slotEvs.forEach(ev=>{
        let c=COLORS[ev.color||0];
        let isPend=ev.status==='pending';
        let min=parseInt((ev.time_start||'00:00').split(':')[1]||0);
        let top=Math.round(min/60*40);
        let ht=Math.max(16,Math.round(Math.min(ev.duration_min||60,60)/60*40)-2);
        h+=`<div class="we" style="background:${isPend?'var(--orange-light)':c.bg};color:${isPend?'var(--orange)':c.text};border-left-color:${isPend?'var(--orange)':c.border};top:${top}px;height:${ht}px" onclick="event.stopPropagation();openEdit('${ev.id}')">${ev.time_start?ev.time_start.slice(0,5)+' ':''}${esc(ev.title)}</div>`;
      });
      h+='</div>';
    });
  }
  return h+'</div></div>';
}

// ---- PENDING PANEL ----
function renderPending(){
  const list=pendingList();
  const el=document.getElementById('pending-list');
  if(!list.length){el.innerHTML='<div class="empty"><div class="ico">✅</div>Aucune demande en attente</div>';return;}
  el.innerHTML=list.map(ev=>{
    let c=COLORS[ev.color||0];
    let emp=profiles.find(p=>p.id===ev.employee_id);
    let empName=emp?.full_name||emp?.email||'—';
    let dateStr=ev.date?new Date(ev.date).toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'long'}):'';
    return `<div class="req-card">
      <div class="req-color" style="background:${c.border}"></div>
      <div class="req-info">
        <h4>${esc(ev.title)}</h4>
        <p>👤 ${esc(empName)} &nbsp;·&nbsp; 📅 ${dateStr}${ev.time_start?' à '+ev.time_start.slice(0,5):''}${ev.note?' &nbsp;·&nbsp; '+esc(ev.note.slice(0,60)):''}</p>
      </div>
      <div class="req-actions">
        <button class="btn sm success" onclick="approveEvent('${ev.id}')">✓ Approuver</button>
        <button class="btn sm danger" onclick="rejectEvent('${ev.id}')">✗ Rejeter</button>
      </div>
    </div>`;
  }).join('');
}

async function approveEvent(id){
  await db.from('events').update({status:'approved'}).eq('id',id);
  toast('✅ Demande approuvée');
  await loadData();render();renderPending();
}
async function rejectEvent(id){
  if(!confirm('Rejeter cette demande ?'))return;
  await db.from('events').update({status:'rejected'}).eq('id',id);
  toast('❌ Demande rejetée');
  await loadData();render();renderPending();
}

// ---- TEAM ----
function renderTeam(){
  const el=document.getElementById('team-list');
  if(!profiles.length){el.innerHTML='<div class="empty"><div class="ico">👥</div>Aucun membre trouvé</div>';return;}
  el.innerHTML=`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.75rem">
    ${profiles.map(p=>{
      const myEvs=events.filter(e=>e.employee_id===p.id&&e.status==='approved');
      const pending=events.filter(e=>e.employee_id===p.id&&e.status==='pending').length;
      return `<div style="background:var(--surface);border:1px solid var(--border2);border-radius:var(--rl);padding:1rem">
        <div style="display:flex;align-items:center;gap:.6rem;margin-bottom:.6rem">
          <div style="width:36px;height:36px;border-radius:50%;background:var(--accent-light);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9rem">${(p.full_name||p.email||'?')[0].toUpperCase()}</div>
          <div>
            <div style="font-size:.875rem;font-weight:600">${esc(p.full_name||p.email)}</div>
            <span class="role-badge ${p.role}">${p.role}</span>
          </div>
        </div>
        <div style="font-size:.78rem;color:var(--text2)">${myEvs.length} événement(s)${pending?` · <span style="color:var(--orange)">${pending} en attente</span>`:''}</div>
      </div>`;
    }).join('')}
  </div>`;
}

// ---- MODAL ----
function buildColorRow(sel){
  document.getElementById('color-row').innerHTML=COLORS.map((c,i)=>
    `<div class="cdot${i===sel?' on':''}" style="background:${c.bg};border-color:${i===sel?c.border:'transparent'}" onclick="pickColor(${i})"></div>`
  ).join('');
}
function pickColor(i){selColor=i;buildColorRow(i);}

function openAdd(ds,time){
  editId=null;
  document.getElementById('modal-title').textContent=isAdmin()?'Nouvel événement':'Demande d\'ajout';
  document.getElementById('btn-del').style.display='none';
  document.getElementById('ev-title').value='';
  document.getElementById('ev-date').value=ds||toKey(today);
  document.getElementById('ev-time').value=time||'';
  document.getElementById('ev-dur').value='60';
  document.getElementById('ev-note').value='';
  selColor=0;buildColorRow(0);

  // admin can assign to employee
  const empWrap=document.getElementById('employee-select-wrap');
  const admWrap=document.getElementById('admin-direct-wrap');
  if(isAdmin()){
    empWrap.style.display='block';
    admWrap.style.display='block';
    document.getElementById('ev-direct').checked=true;
    const sel=document.getElementById('ev-employee');
    sel.innerHTML=profiles.map(p=>`<option value="${p.id}">${esc(p.full_name||p.email)}</option>`).join('');
  } else {
    empWrap.style.display='none';
    admWrap.style.display='none';
  }

  document.getElementById('overlay').style.display='flex';
  setTimeout(()=>document.getElementById('ev-title').focus(),60);
}

function openEdit(id){
  const ev=events.find(e=>e.id===id);if(!ev)return;
  // employee can only edit own pending events
  if(!isAdmin()&&ev.status!=='pending')return toast('Seuls les événements en attente sont modifiables.');
  if(!isAdmin()&&ev.employee_id!==currentUser.id)return toast('Vous ne pouvez pas modifier cet événement.');
  editId=id;
  document.getElementById('modal-title').textContent=isAdmin()?'Modifier l\'événement':'Modifier ma demande';
  document.getElementById('btn-del').style.display='';
  document.getElementById('ev-title').value=ev.title||'';
  document.getElementById('ev-date').value=ev.date||'';
  document.getElementById('ev-time').value=ev.time_start?ev.time_start.slice(0,5):'';
  document.getElementById('ev-dur').value=String(ev.duration_min||60);
  document.getElementById('ev-note').value=ev.note||'';
  selColor=ev.color||0;buildColorRow(selColor);
  const empWrap=document.getElementById('employee-select-wrap');
  const admWrap=document.getElementById('admin-direct-wrap');
  if(isAdmin()){
    empWrap.style.display='block';admWrap.style.display='block';
    document.getElementById('ev-direct').checked=ev.status==='approved';
    const sel=document.getElementById('ev-employee');
    sel.innerHTML=profiles.map(p=>`<option value="${p.id}"${p.id===ev.employee_id?' selected':''}>${esc(p.full_name||p.email)}</option>`).join('');
  } else {empWrap.style.display='none';admWrap.style.display='none';}
  document.getElementById('overlay').style.display='flex';
}

function closeModal(){document.getElementById('overlay').style.display='none';editId=null;}

async function saveEvent(){
  const title=document.getElementById('ev-title').value.trim();
  if(!title){document.getElementById('ev-title').style.boxShadow='0 0 0 2px var(--red)';return;}
  document.getElementById('ev-title').style.boxShadow='';

  const empId=isAdmin()?document.getElementById('ev-employee').value:currentUser.id;
  const direct=isAdmin()&&document.getElementById('ev-direct').checked;

  const payload={
    title,
    date:document.getElementById('ev-date').value,
    time_start:document.getElementById('ev-time').value||null,
    duration_min:parseInt(document.getElementById('ev-dur').value)||60,
    note:document.getElementById('ev-note').value.trim()||null,
    color:selColor,
    employee_id:empId,
    status:direct?'approved':'pending',
    created_by:currentUser.id,
  };

  if(editId){
    await db.from('events').update(payload).eq('id',editId);
    toast(isAdmin()?'✏️ Événement modifié':'📬 Demande de modification envoyée');
  } else {
    await db.from('events').insert(payload);
    toast(direct?'✅ Événement ajouté':'📬 Demande envoyée — en attente d\'approbation');
  }
  await loadData();closeModal();render();updatePendingCount();
}

async function deleteEvent(){
  if(!editId)return;
  if(!confirm('Supprimer cet événement ?'))return;
  await db.from('events').delete().eq('id',editId);
  toast('🗑 Supprimé');
  await loadData();closeModal();render();updatePendingCount();
}

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

// ---- BOOT ----
db.auth.onAuthStateChange((event,session)=>{
  if(session?.user)initApp(session.user);
  else{
    document.getElementById('auth-screen').style.display='flex';
    document.getElementById('main-app').style.display='none';
    document.getElementById('fab').style.display='none';
  }
});
</script>
</body>
</html>
